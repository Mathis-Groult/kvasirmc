# Test fixture of pumpkin-wasm-host: a plugin whose on_load reports what its WASI sandbox lets it
# do. Its own workspace; `build.sh` rebuilds the committed probe.wasm.
[workspace]

[package]
name = "probe-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { path = "../../../pumpkin-plugin-api" }

[profile.release]
opt-level = "s"
lto = true
strip = true
